<div id="home" class="home">
 <header class="topbar">
  <div class="brand"><img src="../assets/logo.webp" width="44" height="44" alt=""><strong>Approaches</strong></div>
  <div class="tools">
   <button id="report-open" class="icon" type="button" aria-label="Child’s report" title="Child’s report" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16v-5m5 5V6m5 10v-8"/></svg></button>
   <button id="goals-open" class="icon" type="button" aria-label="Long-term and short-term goals" title="Long-term and short-term goals" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></button>
   <button id="account" class="account" type="button" aria-haspopup="dialog"><span id="account-face" hidden></span><span id="account-name">Accounts</span></button>
   <a class="icon home-link" href="../index.html" aria-label="The app’s home page" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
  </div>
 </header>
 <main class="home-main">
  <section class="hero"><img src="../assets/logo.webp" alt=""><h1>Approaches</h1><p>Pairs, oppositions and cycles</p></section>
  <nav class="actions approach-actions" aria-label="Approaches">
   <button class="action" type="button" data-approach="pairs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="8" height="14" rx="2"/><rect x="14" y="5" width="8" height="14" rx="2"/><path d="m11 12h2"/></svg><span>Minimal pairs</span></button>
   <button class="action" type="button" data-approach="oppositions"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="8" width="6" height="10" rx="1.5"/><rect x="9" y="4" width="6" height="10" rx="1.5"/><rect x="16" y="8" width="6" height="10" rx="1.5"/></svg><span>Multiple oppositions</span></button>
   <button class="action" type="button" data-approach="cycles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/></svg><span>Cycles</span></button>
  </nav>
  <button id="test-switch" class="switch" type="button" role="switch" aria-checked="false" aria-label="Therapist mode"><span class="switch-text">Therapist mode</span><span class="switch-track"><span></span></span></button>
 </main>
 <footer class="contact"><p>SPEECH AND LANGUAGE PATHOLOGY</p><p><strong>Ahmad Ghanem</strong></p><p>Latakia - Syria</p><p><a href="mailto:slp.ahmadghanem@gmail.com">slp.ahmadghanem@gmail.com</a></p></footer>

<section id="patterns" class="letters" hidden aria-labelledby="pattern-title">
 <button id="patterns-back" class="hud-button" type="button" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></button>
 <div class="wood-board"><h2 id="pattern-title" class="board-title"></h2><div id="pattern-tiles" class="pattern-tiles"></div></div>
</section>

<section id="cycle" class="letters" hidden aria-labelledby="cy-pattern">
 <button id="cy-back" class="hud-button" type="button" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></button>
 <div class="wood-board cycle-card">
  <p id="cy-week" class="cycle-week"></p><h2 id="cy-pattern"></h2><b id="cy-target" class="cycle-target"></b>
  <button id="cy-start" class="round cycle-start" type="button" aria-label="Start" title="Start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
  <div id="cy-tools" class="cycle-tools" hidden><button id="cy-next" type="button" class="secondary">Next pattern</button><button id="cy-hold" type="button" class="secondary" aria-pressed="false">Stay on this week</button></div>
 </div>
</section>

<section id="stage" class="stage ap-stage" hidden aria-label="Approaches">
 <div class="hud">
  <button id="leave" class="hud-button tower-leave" type="button" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></button>
  <div class="tower-progress"><div id="ap-dots" class="bricks ap-dots" role="img" aria-label=""></div><span id="ap-title" class="goal-tag"></span></div>
 </div>
 <div class="ap-top"><i id="ap-phase" class="ap-phase" role="img" aria-label=""></i><button id="ap-speaker" class="round ap-speaker" type="button" aria-label="Hear it again" title="Hear" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10zM16 9a4 4 0 0 1 0 6m2.5-9a8 8 0 0 1 0 12"/></svg></button><span id="ap-say" class="ap-say" hidden></span><span id="ap-hint" class="ap-hint"></span></div>
 <div id="ap-cards" class="ap-cards"></div>
 <div id="ap-show" class="ap-show" hidden><div id="ap-show-card" class="ap-card ap-show-card"><img id="ap-show-img" alt=""><span id="ap-show-word" class="ap-word"></span></div><span id="ap-show-count" class="ap-count"></span><button id="ap-show-skip" type="button" class="secondary">Skip</button></div>
 <div class="ap-bottom">
  <div id="ap-grades" class="grades ap-grades" hidden>
   <button data-score="1" class="grade right" type="button" aria-label="Right" title="Right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></button>
   <button data-score="0.5" class="grade semi" type="button" aria-label="Nearly" title="Nearly"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
   <button data-score="0" class="grade wrong" type="button" aria-label="Not yet" title="Not yet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  </div>
  <button id="ap-next" class="round card-go" type="button" aria-label="Next" title="Next" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg></button>
 </div>
 <div id="done" class="panel-layer party" role="dialog" aria-modal="true" aria-labelledby="done-title" hidden>
  <div class="panel score-panel"><h2 id="done-title">Well done!</h2><div id="done-result"></div><div class="row"><button id="done-again" class="primary" type="button">Play again</button><button id="done-home" class="secondary" type="button">Home</button></div></div>
 </div>
</section>

<dialog id="accounts" class="sheet" aria-labelledby="accounts-title">
 <div class="sheet-head"><h2 id="accounts-title" tabindex="-1" autofocus>Accounts</h2><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div id="account-list"></div>
 <form id="account-form" novalidate>
  <label for="child-name">New child</label><input id="child-name" autocomplete="off" maxlength="40" placeholder="Name">
  <div class="heroes" role="radiogroup" aria-label="Character">
   <label class="hero-pick"><input type="radio" name="character" value="boy" checked><span data-kid="boy"></span><span>Boy</span></label>
   <label class="hero-pick"><input type="radio" name="character" value="girl"><span data-kid="girl"></span><span>Girl</span></label>
  </div>
  <p id="account-error" class="error" role="alert" hidden></p>
  <button class="primary" type="submit">Start</button>
 </form>
</dialog>
<dialog id="password" class="sheet narrow" aria-labelledby="password-title">
 <div class="sheet-head"><h2 id="password-title" tabindex="-1" autofocus>Password</h2><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div id="pin-dots" class="pin-dots" dir="ltr" aria-hidden="true"><i></i><i></i><i></i></div>
 <p id="pin-error" class="error center" role="alert"></p>
 <div id="pin-pad" class="pin-pad" dir="ltr"></div>
</dialog>
<dialog id="report" class="sheet wide" aria-labelledby="report-title">
 <div class="sheet-head"><h2 id="report-title" tabindex="-1" autofocus>Child’s report</h2><div class="sheet-tools"><button id="report-pdf" class="icon" type="button" aria-label="Download the report as PDF" title="Download the report as PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></div>
 <p id="report-status" class="center muted" role="status" hidden></p>
 <div id="report-body"></div>
</dialog>
<dialog id="goals" class="sheet" aria-labelledby="goals-title">
 <div class="sheet-head"><h2 id="goals-title" tabindex="-1" autofocus>Goals</h2><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div id="goals-body"></div>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
