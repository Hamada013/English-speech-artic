<div id="home" class="home">

  </div>
 </header>
 <main class="home-main">

   <button id="play" class="action" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg><span>Play</span></button>
  </nav>
  <button id="test-switch" class="switch" type="button" role="switch" aria-checked="false" aria-label="Therapist mode"><span class="switch-text">Therapist mode</span><span class="switch-track"><span></span></span></button>

<section id="letters" class="letters" hidden aria-label="Choose a sound">
 <button id="letters-back" class="hud-button" type="button" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></button>
 <div class="wood-board"><div id="letter-tiles" class="letter-tiles"></div></div>
</section>

<section id="stage" class="stage" hidden aria-label="The game">
 <div id="world" class="world"></div>
 <div class="hud">
  <button id="leave" class="hud-button" type="button" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></button>
  <div id="stars" class="stars" role="img" aria-label=""></div>
  <button id="bag" class="bag" type="button" aria-label="Open the bag" title="Open the bag" aria-haspopup="dialog"><img id="bag-art" alt=""><b id="bag-count" dir="ltr">0</b></button>
 </div>
 <p id="loading" class="loading" role="status">Getting ready…</p>
 <button id="turn" class="turn" type="button" aria-label="Turn the phone to see the whole game">
  <svg viewBox="0 0 240 240" aria-hidden="true">
   <path class="turn-arc" d="M186 44A100 100 0 0 1 216 96"/><path class="turn-head" d="M204 92l13 13 9-16z"/>
   <g class="turn-phone"><rect x="75" y="40" width="90" height="160" rx="15" fill="#f8ecd2"/><rect x="84" y="54" width="72" height="132" rx="5" fill="#a9dbe6" stroke-width="2.5"/>
    <g transform="rotate(-90 120 120)" stroke="none"><ellipse cx="120" cy="124" rx="50" ry="25" fill="#ecd9a8"/><ellipse cx="120" cy="122" rx="41" ry="19" fill="#b9d68f"/><path d="M100 118l10-24 10 24z" fill="#9fc378"/><circle cx="136" cy="112" r="7" fill="#f4a596"/></g>
    <circle cx="120" cy="193" r="3" fill="#5a3d2b" stroke="none"/></g>
  </svg>
 </button>

 <div class="light" aria-hidden="true"></div>

  <div class="pack-bag"><div class="pack-flap"><button id="pack-close" class="round pack-x" type="button" aria-label="Close the bag" title="Close the bag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button><i class="pack-buckle"></i></div><div id="pack-pockets" class="pack-pockets"></div></div>

  <p id="enc-word" class="enc-word"></p>
  <p id="enc-error" class="enc-error" role="status" hidden></p>
  <div class="enc-controls">
   <button id="enc-replay" class="round replay" type="button" hidden aria-label="Hear the word" title="Hear the word"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10zM16 9a4 4 0 0 1 0 6m2.5-9a8 8 0 0 1 0 12"/></svg></button>
   <button id="enc-collect" class="round collect" type="button" aria-label="Put it in the bag" title="Put it in the bag" hidden><img id="enc-bag" alt=""></button>
   <div id="enc-grades" class="grades enc-grades" hidden>
    <button data-score="1" class="grade right" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg><span>Right</span></button>

    <button data-score="0" class="grade wrong" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg><span>Not yet</span></button>
   </div>
  </div>
  </div>
 </div>

 </div>

   <label class="hero-pick"><input type="radio" name="character" value="boy" checked><span data-kid="boy"></span><span>Boy</span></label>
   <label class="hero-pick"><input type="radio" name="character" value="girl"><span data-kid="girl"></span><span>Girl</span></label>
  </div>
  <p id="account-error" class="error" role="alert" hidden></p>
  <button class="primary" type="submit">Start</button>
 </form>
</dialog>

 <div class="sheet-head"><h2 id="password-title" tabindex="-1" autofocus>Password</h2><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div id="pin-dots" class="pin-dots" dir="ltr" aria-hidden="true"><i></i><i></i><i></i></div>

</dialog>

<dialog id="goals" class="sheet" aria-labelledby="goals-title">
 <div class="sheet-head"><h2 id="goals-title" tabindex="-1" autofocus>Goals</h2><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div id="goals-body"></div>
</dialog>

<dialog id="install-dialog" class="sheet narrow" aria-labelledby="install-title">
 <div class="sheet-head"><h2 id="install-title" tabindex="-1" autofocus>Download</h2><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <progress id="offline-progress" max="100" value="0"></progress><p id="offline-status" class="center" dir="ltr" role="status">0%</p><p id="offline-error" class="error center" role="alert" hidden></p>

</dialog>
