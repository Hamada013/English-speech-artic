rt-words-en.js" defer></script><script src="../words/assets/art-cozy.js" defer></script><script src="assets/data.js" defer></script><script src="assets/plan.js" defer></script><script src="assets/report.js" defer></script><script src="assets/audio.js" defer></script><script src="../assets/children.js" defer></script><script src="../assets/parent-gate.js" defer></script><script src="../assets/accounts.en.js" data-app="english-artic" defer></script><script src="../assets/therapy.js" defer></script><script src="../assets/results.js" defer></script><script src="../assets/clinic.js" defer></script><script src="../assets/intervention-goals.js" defer></script><script src="../assets/intervention.en.js" defer></script><script src="../assets/speech-sync.en.js" data-app="english-artic" defer></script><script src="../assets/speech-entry.en.js" data-app="english-artic" defer></script><script src="../assets/nav.js" defer></script><script src="../assets/today.js" defer></script><script src="../assets/voice.js" defer></script><script src="../assets/feel.js" defer></script>

</head><body>
<div id="home" class="home">
 <header class="topbar">
  <div class="brand"><img src="../assets/logo.webp" width="44" height="44" alt=""><strong>Syllables</strong></div>
  <div class="tools">
   <button id="report-open" class="icon" type="button" aria-label="Child’s report" title="Child’s report" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16v-5m5 5V6m5 10v-8"/></svg></button>
   <button id="goals-open" class="icon" type="button" aria-label="Long-term and short-term goals" title="Long-term and short-term goals" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></button>
   <button id="account" class="account" type="button" aria-haspopup="dialog"><span id="account-face" hidden></span><span id="account-name">Accounts</span></button>
   <a class="icon home-link" href="../index.html" aria-label="The app’s home page" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></a>
  </div>
 </header>
 <main class="home-main">
  <section class="hero"><img src="../assets/logo.webp" alt=""><h1>Syllables</h1><p>The syllable train</p></section>
  <nav class="actions" aria-label="Activities">
   <button id="play" class="action" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg><span>Play</span></button>
  </nav>
  <button id="test-switch" class="switch" type="button" role="switch" aria-checked="false" aria-label="Therapist mode"><span class="switch-text">Therapist mode</span><span class="switch-track"><span></span></span></button>
  <nav id="therapist-tools" class="therapist-tools" aria-label="Therapist tools" hidden></nav>
 </main>
 <footer class="contact"><p>SPEECH AND LANGUAGE PATHOLOGY</p><p><strong>Ahmad Ghanem</strong></p><p>Latakia - Syria</p><p><a href="mailto:slp.ahmadghanem@gmail.com">slp.ahmadghanem@gmail.com</a></p></footer>
</div>

<section id="letters" class="letters" hidden aria-label="Choose a sound">
 <button id="letters-back" class="hud-button" type="button" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></button>
 <div class="wood-board"><div id="letter-tiles" class="letter-tiles"></div></div>
</section>

<section id="stage" class="stage" hidden aria-label="The syllable train">
 <div id="world" class="world"></div>
 <div class="hud">
  <button id="leave" class="hud-button" type="button" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></button>
  <div id="stations" class="stations" role="img" aria-label=""></div>
  <button id="grade-open" class="hud-button grade-open" type="button" aria-label="Grade the child’s speech" title="Grade the child’s speech" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>
 </div>
 <button id="go" class="round go train-go" type="button" aria-label="Go to the next station" title="Go" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
 <p id="loading" class="loading" role="status">Getting ready…</p>

 <div id="grading" class="pack grading" role="dialog" aria-modal="true" aria-labelledby="grading-title" hidden>
  <div class="grading-card"><div class="grading-head"><h2 id="grading-title">Grading</h2><button id="grading-close" class="round pack-x" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="grading-rows" class="grading-rows"></div></div>
 </div>

 <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title" hidden>
  <div class="viewer-card">
  <div class="viewer-head"><h2 id="viewer-title" class="viewer-title"></h2><button id="viewer-close" class="round pack-x" type="button" aria-label="Back to the train" title="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div id="viewer-panes" class="viewer-panes"></div>
  <div class="viewer-modes" role="group" aria-label="View">
   <button type="button" data-view="front" aria-label="Front" title="Front"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15q3 2 6 0"/></svg></button>
   <button type="button" data-view="side" aria-label="Side" title="Side"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3a8 8 0 0 0-8 8l-3 3 2 1v3a2 2 0 0 0 2 2h3v2"/><path d="M15 3a7 7 0 0 1 4 12v6"/><path d="M11 10h.01"/></svg></button>
   <button type="button" data-view="both" aria-label="Front and side together" title="Both"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="9" height="14" rx="2"/><rect x="13" y="5" width="9" height="14" rx="2"/></svg></button>
   <button type="button" data-view="camera" aria-label="Camera beside the drawing" title="Camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v12H4Z"/><circle cx="12" cy="13" r="4"/></svg></button>
  </div>
  <p id="viewer-status" class="viewer-status" role="status"></p>
  </div>
 </div>

 <div id="done" class="panel-layer party" role="dialog" aria-modal="true" aria-labelledby="done-title" hidden>
  <div class="panel score-panel"><h2 id="done-title">Well done!</h2><div id="done-result"></div><div class="row"><button id="done-again" class="primary" type="button">Play again</button><button id="done-home" class="secondary" type="button">Home</button></div></div>
 </div>
 <button id="turn" class="turn" type="button" aria-label="Turn the phone to see the whole train">
  <svg viewBox="0 0 240 240" aria-hidden="true"><path class="turn-arc" d="M186 44A100 100 0 0 1 216 96"/><path class="turn-head" d="M204 92l13 13 9-16z"/><g class="turn-phone"><rect x="75" y="40" width="90" height="160" rx="15" fill="#f8ecd2"/><rect x="84" y="54" width="72" height="132" rx="5" fill="#d8ecf0" stroke-width="2.5"/><g transform="rotate(-90 120 120)" stroke="none"><rect x="70" y="112" width="100" height="26" rx="8" fill="#e0b25c"/><circle cx="90" cy="142" r="8" fill="#5a3d2b"/><circle cx="150" cy="142" r="8" fill="#5a3d2b"/></g><circle cx="120" cy="193" r="3" fill="#5a3d2b" stroke="none"/></g></svg>
 </button>
</section>

<dialog id="accounts" class="sheet" aria-labelledby="accounts-title">
 <div class="sheet-head"><h2 id="accounts-title" tabindex="-1" autofocus>Accounts</h2><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div id="account-list"></div>
 <form id="account-form" novalidate>
  <label for="child-name">New child</label><input id="child-name" autocomplete="off" maxlength="40" placeholder="Name">
  <div class="heroes" role="radiogroup" aria-label="Character">
   <label class="hero-pick"><input type="radio" name="character" value="boy" checked><span data-kid="boy"></span><span>Boy</span></label>
   <label class="hero-pick"><input type="radio" name="character" value="girl"><span data-kid="girl"></span><span>Girl</span></label>
  </div>
  <p id="account-error" class="error" role="alert" hidden></p>
  <button class="primary" type="submit">Start</button>
 </form>
</dialog>
<dialog id="password" class="sheet narrow" aria-labelledby="password-title">
 <div class="sheet-head"><h2 id="password-title" tabindex="-1" autofocus>Password</h2><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div id="pin-dots" class="pin-dots" dir="ltr" aria-hidden="true"><i></i><i></i><i></i></div>
 <p id="pin-error" class="error center" role="alert"></p>
 <div id="pin-pad" class="pin-pad" dir="ltr"></div>
</dialog>
<dialog id="report" class="sheet wide" aria-labelledby="report-title">
 <div class="sheet-head"><h2 id="report-title" tabindex="-1" autofocus>Child’s report</h2><div class="sheet-tools"><button id="report-pdf" class="icon" type="button" aria-label="Download the report as PDF" title="Download the report as PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div></div>
 <p id="report-status" class="center muted" role="status" hidden></p>
 <div id="report-body"></div>
</dialog>
<dialog id="goals" class="sheet" aria-labelledby="goals-title">
 <div class="sheet-head"><h2 id="goals-title" tabindex="-1" autofocus>Goals</h2><button class="icon" data-close type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
 <div id="goals-body"></div>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
